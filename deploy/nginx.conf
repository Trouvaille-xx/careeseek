# CareeSeek 生产部署（Nginx 反代 + HTTPS 示例）
# 前端静态文件由 Fastify 同域服务（/dist），Nginx 只做 TLS 终止 + 转发

server {
    listen 80;
    server_name careeseek.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name careeseek.example.com;

    ssl_certificate     /etc/letsencrypt/live/careeseek.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/careeseek.example.com/privkey.pem;

    client_max_body_size 20m;

    # API 与前端同域（Fastify 同时服务 /v1 与静态文件）
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式支持
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
